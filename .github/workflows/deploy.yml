name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # false (not true): a frequently-pushed Pages repo must let an in-flight deployment
  # FINISH. Cancelling mid-swap leaves the live site serving 404 until the next good
  # deploy — the cause of the intermittent dtstamford.com 404s. GitHub's own guidance.
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify site integrity (block deploy if a page/link/asset is missing)
        run: python3 .github/scripts/verify-site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages waits for GitHub to unpack and publish the artifact, then gives up at its
          # DEFAULT 600000ms (10 min). On 2026-08-06 the site grew from ~1,700 to 4,380 listings
          # (2,682 sold pages added) and every deploy began dying exactly at the 10-minute mark with
          # "Timeout reached, aborting!" while still deployment_queued — the upload succeeded and the
          # integrity gate passed, so this was purely the action giving up before Pages finished a
          # now-bigger site. 30 min leaves headroom as inventory grows. Raising the ceiling does not
          # slow a normal deploy: it returns as soon as the deployment reports success.
          timeout: 1800000
