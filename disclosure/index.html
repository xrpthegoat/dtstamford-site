function drawStrokes(ctx, list, scale = 1, ox = 0, oy = 0, weight = 2.4) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = weight * scale;
  for (const st of list) {
    const P = st.map(([x, y]) => [(x - ox) * scale, (y - oy) * scale]);
    if (P.length === 1) { ctx.beginPath(); ctx.arc(P[0][0], P[0][1], 1.4 * scale, 0, Math.PI * 2); ctx.fill(); continue; }
    ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < P.length - 1; i++) ctx.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
    ctx.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
    ctx.stroke();
  }
}
function redrawPad(c) {
  const ctx = c.getContext('2d');
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore();
  drawStrokes(ctx, strokes[c.id] || []);
}
function mountPads() {
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  document.querySelectorAll('canvas.pad').forEach((c) => {
    const r = c.getBoundingClientRect();
    c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    strokes[c.id] ||= [];
    redrawPad(c);
    if (c.dataset.bound) return;
    c.dataset.bound = '1';
    let cur = null;
    const pt = (e) => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    c.addEventListener('pointerdown', (e) => {
      e.preventDefault(); c.setPointerCapture?.(e.pointerId);
      cur = [pt(e)]; strokes[c.id].push(cur); redrawPad(c);
    });
    c.addEventListener('pointermove', (e) => {
      if (!cur) return;
      e.preventDefault();
      for (const ev of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) cur.push(pt(ev));
      redrawPad(c);
    });
    const end = () => { if (!cur) return; cur = null; signedBytes = null; updateSignUI(); };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('lostpointercapture', end);
  });
}
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (state.at === 'sign') mountPads(); }, 120); });

function updateSignUI() {
  const b = document.querySelector('[data-act="sign-generate"]');
  if (b) b.disabled = !signReady();
  const d = document.getElementById('signed-done');
  if (d && !signedBytes) d.remove();
}

// Trim a pad's ink to its bounding box and export a high-resolution transparent PNG.
async function padPng(id) {
  const list = strokes[id] || [];
  const pts = list.flat();
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const m = 4, x0 = Math.min(...xs) - m, y0 = Math.min(...ys) - m;
  const w = Math.max(...xs) - x0 + m, h = Math.max(...ys) - y0 + m, S = 4;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(w * S); cv.height = Math.ceil(h * S);
  drawStrokes(cv.getContext('2d'), list, S, x0, y0, 3.4);   // heavier than on screen: it prints small
  const blob = await new Promise((resolve) => cv.toBlob(resolve, 'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}

async function signAndGenerate() {
  const names = signers();
  const msg = $('#sign-msg');
  const btn = document.querySelector('[data-act="sign-generate"]');
  btn.disabled = true; btn.textContent = 'Signing…';
  try {
    if (!window.PDFLib) throw new Error('The PDF tool did not load. Check your connection and reload the page.');
    const sellers = [];
    for (let i = 0; i < names.length; i++) sellers.push({ name: names[i], signature: await padPng(`sig-${i}`), initials: await padPng(`ini-${i}`) });
    const { bytes, report } = await fillRPCR({
      PDFLib: window.PDFLib, templateBytes: await template(), answers: A(), extraPages: state.extraPages,
      sign: { at: new Date(), consent: names.length > 1 ? CONSENT_TWO : CONSENT_ONE, sellers },
    });
    signedBytes = bytes;
    window.__lastReport = report;
    render();
    setTimeout(() => $('#signed-done')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0);
  } catch (e) {
    msg.hidden = false; msg.textContent = e.message || String(e);
    btn.disabled = false; btn.textContent = 'Sign and create my form';
  }
}

// Hand a file to the viewer. Inside a claude.ai Artifact the frame can't download anything itself,
// so it goes through the platform's `downloads` capability (the viewer confirms the save); anywhere
// else (the plain static site) an ordinary download link does it. Returns 'saved' or a message.
async function saveFile(filename, blob) {
  const downloads = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (downloads) {
    try {
      await downloads.save({ filename, data: blob });
      return 'saved';
    } catch (e) {
      if (e?.code === 'declined') return 'Download cancelled. Tap the button again when you’re ready.';
      if (e?.code === 'rate_limited') return 'A download is already waiting for you to confirm it.';
      return 'This page can’t save files here. Open it in a web browser to download the form.';
    }
  }
  const url = URL.createObjectURL(blob);
  const link = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return 'saved';
}

// In-page replacement for the browser's native dialogs, which sandboxed viewers silently refuse.
// Resolves true for the OK button; `cancel: null` makes it a one-button notice.
function askConfirm(message, ok = 'OK', cancel = 'Cancel') {
  const d = $('#ask');
  $('#ask-msg').textContent = message;
  $('#ask-ok').textContent = ok;
  $('#ask-cancel').hidden = cancel === null;
  if (cancel) $('#ask-cancel').textContent = cancel;
  d.returnValue = '';
  d.showModal();
  $('#ask-ok').focus();
  return new Promise((resolve) => d.addEventListener('close', () => resolve(d.returnValue === 'ok'), { once: true }));
}
async function importAnswers(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.kind !== 'ct-rpcr-answers' || typeof data.answers !== 'object') throw new Error('That file is not a saved answers file from this questionnaire.');
    if (Object.keys(A()).length && !(await askConfirm('Replace the answers on this device with the ones in this file?', 'Replace my answers'))) return;
    state = { answers: data.answers, at: data.at || 'review', extraPages: data.extraPages || 0, confirmed: false, lastQ: data.lastQ, updated: null };
    pdfDirty(); save(); go(state.at);
  } catch (e) {
    await askConfirm(e.message || 'Could not read that file.', 'OK', null);
  } finally {
    $('#import-file').value = '';
  }
}

// ── access gate ──
// A PBKDF2 hash of the code is all the page holds. A visitor unlocks once per device (remembered),
// or arrives through the agent's link, which carries ?code= and is stripped from the address bar.
const ACCESS_KEY = 'ct-rpcr-access';
async function codeMatches(code) {
  const enc = new TextEncoder();
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
  const salt = new Uint8Array(ACCESS.salt.match(/../g).map((h) => parseInt(h, 16)));
  const key = await crypto.subtle.importKey('raw', enc.encode(code.trim().toUpperCase()), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ACCESS.iterations }, key, 256);
  return hex(bits) === ACCESS.hash;
}
function rememberAccess() { try { localStorage.setItem(ACCESS_KEY, ACCESS.hash); } catch {} }
async function hasAccess() {
  if (!ACCESS) return true;
  try { if (localStorage.getItem(ACCESS_KEY) === ACCESS.hash) return true; } catch {}
  const url = new URL(location.href);
  const code = url.searchParams.get('code');
  if (code) {
    url.searchParams.delete('code');
    history.replaceState(null, '', url.pathname + url.search + url.hash);
    if (await codeMatches(code)) { rememberAccess(); return true; }
  }
  return false;
}
function renderGate(wrong = false) {
  document.querySelector('.layout').classList.remove('with-sidebar');
  $('#progress').hidden = true;
  $('#screen').innerHTML = `
  <section class="card gate">
    <p class="eyebrow">${esc(BRAND.team)}</p>
    <h1 class="q-title" tabindex="-1">Enter your access code</h1>
    <p class="help">${esc(ACCESS.hint || 'Your agent sent you a code with the link to this questionnaire.')}</p>
    <form id="gate-form" class="block" autocomplete="off">
      <label class="lbl" for="gate-code" style="display:block;font-weight:600;margin-bottom:6px">Access code</label>
      <input class="input gate-input" id="gate-code" autocapitalize="characters" spellcheck="false" inputmode="text" maxlength="24" required>
      ${wrong ? '<p class="nudge" role="alert">That code didn’t match. Check the message from your agent and try again.</p>' : ''}
      <div class="nav"><span></span><button class="btn btn-primary btn-lg" type="submit">Unlock</button></div>
    </form>
    ${agentCard()}
  </section>`;
  fillAgentPhoto();
  $('#gate-code').focus();
  $('#gate-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.submitter || $('#gate-form button'); btn.disabled = true; btn.textContent = 'Checking…';
    if (await codeMatches($('#gate-code').value)) { rememberAccess(); render(); }
    else renderGate(true);
  });
}

// ── boot ──
$('#brand-team').textContent = BRAND.team;
if (BRAND.logo) { const m = document.querySelector('.brand-mark'); m.classList.add('has-logo'); m.style.backgroundImage = `url("${BRAND.logo}")`; }
if (state.updated) $('#saved').innerHTML = 'Saved<span class="saved-long"> on this device</span>';
hasAccess().then((ok) => (ok ? render() : renderGate()));

</script>
