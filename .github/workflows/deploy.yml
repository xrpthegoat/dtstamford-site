name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # false (not true): a frequently-pushed Pages repo must let an in-flight deployment
  # FINISH. Cancelling mid-swap leaves the live site serving 404 until the next good
  # deploy — the cause of the intermittent dtstamford.com 404s. GitHub's own guidance.
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify site integrity (block deploy if a page/link/asset is missing)
        run: python3 .github/scripts/verify-site.py
      - name: Verify rental price periods and monthly budgets
        run: |
          python3 .github/scripts/verify-rental-pricing.py
          node .github/scripts/test-rental-pricing.mjs
          python3 .github/scripts/test-rental-publication.py
      - name: Package below the GitHub Pages size limit
        run: |
          python3 .github/scripts/test-package-site.py
          python3 .github/scripts/package-site.py . "$RUNNER_TEMP/pages-site"
          cd "$RUNNER_TEMP/pages-site"
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-site.py"
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-rental-pricing.py" .
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
